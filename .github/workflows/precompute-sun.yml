name: precompute-solar

on:
  schedule:
    # 03:00 UTC todos los días (≈ 04:00/05:00 hora Madrid según DST)
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # terrazas.min.json no está versionado: se genera desde el censo crudo.
      - run: npm run prepare:data

      # 1) Posición solar del día (azimut/altitud cada 15 min).
      - run: npm run precompute:sun

      # 2) Matriz solar: estado sol/sombra/noche de las 6.202 terrazas en las 48
      #    franjas de 30 min del día, usando los edificios oficiales del Ayto.
      #    (tiles ya versionados en public/buildings). Tarda ~30 s.
      - name: Precalcular matriz solar
        run: npm run precompute:matrix

      - name: Verificar salida
        run: |
          ls -l public/solar-matrix.bin public/solar-matrix.meta.json
          test -s public/solar-matrix.bin

      - name: Commit cambios si los hay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ARCHIVOS="public/solar-day.json public/solar-matrix.bin public/solar-matrix.meta.json"
          if [ -n "$(git status --porcelain $ARCHIVOS)" ]; then
            git add $ARCHIVOS
            git commit -m "chore(precompute): sol y matriz solar del dia"
            git push
          else
            echo "Sin cambios en los datos precalculados."
          fi
